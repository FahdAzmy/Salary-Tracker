<!-- Micro-interaction Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('salary-input');
            
            // Auto-focus the input on load for immediate typing
            setTimeout(() => {
                input.focus();
            }, 100);

            // Number formatting logic
            input.addEventListener('input', function(e) {
                // Get cursor position
                const cursorPosition = e.target.selectionStart;
                const originalLength = e.target.value.length;

                // Remove non-digits
                let value = e.target.value.replace(/\D/g, '');
                
                // Format with commas
                if (value) {
                    value = parseInt(value, 10).toLocaleString('en-US');
                }
                
                e.target.value = value;

                // Attempt to maintain cursor position
                const newLength = e.target.value.length;
                const diff = newLength - originalLength;
                const newPosition = Math.max(0, cursorPosition + diff);
                
                e.target.setSelectionRange(newPosition, newPosition);
            });
        });
    </script>
<style>
        /* Simple load animation */
        @keyframes fadeInUp {
            from {

                transform: translateY(20px);
            }
            to {

            }

        .animate-fade-in-up {
