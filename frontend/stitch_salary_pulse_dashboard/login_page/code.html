<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - SalaryTracker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-bright": "#f9f9ff",
                      "tertiary-fixed": "#6ffbbe",
                      "surface-container-high": "#e1e8fd",
                      "secondary-fixed-dim": "#b7c8e1",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-low": "#f1f3ff",
                      "tertiary-fixed-dim": "#4edea3",
                      "outline": "#777587",
                      "surface": "#f9f9ff",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed-variant": "#3323cc",
                      "background": "#f9f9ff",
                      "on-tertiary-fixed": "#002113",
                      "tertiary": "#005338",
                      "primary": "#3525cd",
                      "on-primary-container": "#dad7ff",
                      "on-secondary": "#ffffff",
                      "on-error": "#ffffff",
                      "on-surface": "#141b2b",
                      "surface-container": "#e9edff",
                      "secondary-container": "#d0e1fb",
                      "on-background": "#141b2b",
                      "surface-dim": "#d3daef",
                      "inverse-primary": "#c3c0ff",
                      "on-primary": "#ffffff",
                      "outline-variant": "#c7c4d8",
                      "on-secondary-fixed-variant": "#38485d",
                      "on-primary-fixed": "#0f0069",
                      "error-container": "#ffdad6",
                      "primary-fixed-dim": "#c3c0ff",
                      "on-surface-variant": "#464555",
                      "on-secondary-fixed": "#0b1c30",
                      "on-tertiary-fixed-variant": "#005236",
                      "primary-fixed": "#e2dfff",
                      "inverse-surface": "#293040",
                      "primary-container": "#4f46e5",
                      "secondary": "#505f76",
                      "tertiary-container": "#006e4b",
                      "surface-tint": "#4d44e3",
                      "on-secondary-container": "#54647a",
                      "on-tertiary-container": "#67f4b7",
                      "surface-container-highest": "#dce2f7",
                      "error": "#ba1a1a",
                      "inverse-on-surface": "#edf0ff",
                      "on-error-container": "#93000a",
                      "secondary-fixed": "#d3e4fe",
                      "surface-variant": "#dce2f7"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "base": "8px",
                      "gutter": "24px",
                      "sm": "8px",
                      "lg": "24px",
                      "container-max": "1280px",
                      "xxl": "48px",
                      "xl": "32px",
                      "xs": "4px",
                      "md": "16px"
              },
              "fontFamily": {
                      "label-md": ["Inter"],
                      "headline-md": ["Inter"],
                      "body-md": ["Inter"],
                      "label-sm": ["Inter"],
                      "headline-sm": ["Inter"],
                      "body-sm": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-lg": ["Inter"],
                      "label-lg": ["Inter"],
                      "display-lg": ["Inter"],
                      "headline-lg-mobile": ["Inter"]
              },
              "fontSize": {
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-sm": ["11px", {"lineHeight": "16px", "fontWeight": "500"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}]
              }
            }
          }
        }
    </script>
<style>
        /* Base styles to ensure consistency */
        body { font-family: 'Inter', sans-serif; }
        
        /* Subtle background pattern for premium feel */
        .bg-pattern {
            background-image: radial-gradient(var(--tw-colors-outline-variant) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.15;
        }
        
        /* Input focus transitions */
        input:focus + label,
        input:not(:placeholder-shown) + label {
            transform: translateY(-1.5rem) scale(0.85);
            color: var(--tw-colors-primary);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-md relative overflow-hidden">
<!-- Atmospheric Background Elements -->
<div class="absolute inset-0 bg-pattern pointer-events-none z-0"></div>
<div class="absolute -top-40 -right-40 w-96 h-96 bg-primary-container/20 rounded-full blur-[100px] pointer-events-none z-0"></div>
<div class="absolute -bottom-40 -left-40 w-96 h-96 bg-tertiary-container/10 rounded-full blur-[100px] pointer-events-none z-0"></div>
<main class="w-full max-w-[440px] z-10 relative">
<!-- Elevated Card (Glassmorphism inspired) -->
<div class="bg-surface-container-lowest/95 backdrop-blur-xl rounded-xl border border-outline-variant shadow-lg p-xl flex flex-col gap-lg">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-xs mb-sm">
<!-- Brand Anchor -->
<div class="w-12 h-12 bg-primary-container rounded-lg flex items-center justify-center mb-sm shadow-sm">
<span class="material-symbols-outlined text-on-primary-container text-2xl" style="font-variation-settings: 'FILL' 1;">monitoring</span>
</div>
<h1 class="font-headline-sm text-headline-sm text-primary font-bold tracking-tight">SalaryTracker</h1>
<h2 class="font-headline-md text-headline-md text-on-surface mt-xs">Welcome Back</h2>
<p class="font-body-sm text-body-sm text-secondary">Securely login to manage your finances.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] pointer-events-none">mail</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-md py-[10px] font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center ml-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-12 py-[10px] font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors flex items-center justify-center p-1 rounded-md hover:bg-surface-variant" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggleIcon">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-[12px] rounded-lg hover:bg-surface-tint transition-all shadow-sm flex items-center justify-center gap-sm mt-sm active:scale-[0.98]" type="submit">
                    Login
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Section -->
<div class="text-center pt-md border-t border-outline-variant/50 mt-sm">
<p class="font-body-sm text-body-sm text-secondary">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors ml-xs" href="#">Sign up</a>
</p>
</div>
</div>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
